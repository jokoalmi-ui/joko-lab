  version: 0.1.0
  status: draft
  created: "2026-10-19 10:27"
  method: "extraccion literal del <style> de 4 fichas v5 validadas; contraste y aire de vis.json"
  scope: "piezas verticales 1080x1440 (ficha de perfume). Otras piezas (carrusel, deck 16:9) sin medir todavia"
  measured_from:
    - path: research/infografias/perfume-del-dia-20261019/ficha_d.html
      css_bytes: 7039
      css_md5: ad504a8139a39f89125f4d1f49d02489
      canvas: 1080x1440
    - path: research/infografias/perfume-del-dia-20261017/ficha_a_1440_klein.html
      css_bytes: 6798
      css_md5: 819b023806fa4d14ddce64252cdb35ec
      canvas: 1080x1440
    - path: research/infografias/perfume-del-dia-20261015-cherry/ficha_i.html
      css_bytes: 6788
