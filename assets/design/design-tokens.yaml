# ---------------------------------------------------------------------------
known_drift:
  - "canvas: 1350 (14-15 oct) vs 1440 (17-19 oct) sin criterio escrito"
  - "velo: dos juegos de opacidades; no hay regla de cuando usar cada uno"
  - "densidad: overrides !important al final del CSS distintos por ficha (.sec-head, line-height, paddings)"
  - "estilos duplicados en cada build_ficha.py; no hay import comun (este fichero es el primer intento)"

open_questions:
  - "canvas: RESUELTO 2026-10-19 -> 1440; 1350 queda como legado sin migrar"
  - "ratio minimo aceptable para texto de cuerpo sobre packshot"
  - "como consumen los tokens las skills: variables CSS generadas desde YAML o lectura en el script de build"

# ---------------------------------------------------------------------------
# Gate de variantes (fase 1). Medido sobre renders reales 1080x1440 con Chrome 155.
# Los umbrales NO son a priori: salen de comparar la referencia aprobada (v1)
# con una variante que cumple (v2) y otra que rompe (v3).
gate_variantes:
  criteria:
    overflow_px: 0
    pie_dentro_px: ">= 0"
    contraste_min: 4.5
    aire_px: ">= 24"
  measured_2026_10_19:
    v1_vigente: {overflow: 0, aire: 0, pie_dentro: -12, contraste_min: 4.97}
    v2_compacto: {overflow: 0, aire: 64, pie_dentro: 0, contraste_min: 5.14, veredicto: "cumple"}
    v3_banda: {overflow: 49, aire: 0, pie_dentro: -99, contraste_min: 4.95, veredicto: "descartada: el pie se sale del lienzo"}
  method_note: "contraste medido sobre pixeles del PNG (percentil 5 vs 95 de luminancia en la caja del texto). NO es el mismo metodo que la puerta 17/17, que mide fondo vs color declarado: las cifras no son comparables entre si."
