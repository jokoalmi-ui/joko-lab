  confidence:
    color: "alta (unica fuente, valores identicos en las 4)"
    typography: "alta (familias y escala identicas en las 4)"
    geometry: "media (dos regimenes de altura conviven: 1350 y 1440)"
    contrast: "medida por pieza, no fijada como objetivo"

# ---------------------------------------------------------------------------
canvas:
  vigente:
    id: ficha-3x4-1440
    width: 1080
    height: 1440
    ratio: "3:4"
    overflow: hidden
    status: "DECIDIDO 2026-10-19: 1440 es el canvas canonico (eleccion del usuario)"
  legado:
    id: ficha-3x4-1350
    width: 1080
    height: 1350
    status: legado
    used_in: ["2026-10-14", "2026-10-15"]
    note: "convive con el vigente; decidir cual se adopta antes de migrar skills"

# ---------------------------------------------------------------------------
color:
  # Texto
  ink: "#0b2f3f"           # h1, .alt-n, .pie .sprays
  ink_soft: "#1d3a48"      # .dh, .pl .not
  ink_body: "#12303d"      # .inspiracion p
  muted: "#5a6a72"         # .fecha-sep, .r-meta, .alt-casa, .alt-motivo
  muted_2: "#8a9aa3"       # .dh .f
  muted_3: "#7d8e97"       # .fuente-line
  hairline: "#9fb3bc"      # .dh .sep
  cita: "#232f7a"          # .cita blockquote
  cita_fuente: "#6b5bc0"   # .cita .fuente-line
  pie: "#23404d"           # .pie .clima
  # Acentos
  accent_cyan: "#0d6b8c"   # .casa, .sello (color y borde)
  accent_rust: "#b2452a"   # .sub, .caveat-pie, .sello b
  accent_gold: "#c9971c"   # .r-num
  accent_orange: "#c96f1c" # .alt-rt
  # Superficie y bordes
  paper: "rgb(255, 252, 248)"
  qr_border: "#cfd8dc"
  nota_fondo: "#93a1a8"
  blanco: "#ffffff"
  sombra_linea: "rgba(120, 140, 150, 0.35)"   # .pie border-top
  # Velo sobre el fondo fotografico (degradado vertical)
  velo:
    vigente: ["rgba(255,252,248,0.18)", "rgba(255,252,248,0.26)", "rgba(255,252,248,0.40)"]
    legado:  ["rgba(255,252,248,0.36)", "rgba(255,252,248,0.46)", "rgba(255,252,248,0.64)"]
    note: "el velo decide el contraste del texto sobre el packshot; es un parametro de legibilidad, no estetico"

# ---------------------------------------------------------------------------
typography:
  families:
    display: "'Playfair Display', serif"   # pesos 600, 800; italica 500
    script: "'Caveat', cursive"            # peso 600
    sans: "'Inter', sans-serif"            # pesos 400, 600, 800
  source: "Google Fonts (misma @import en las 4 fichas)"
  scale_px: [9, 10, 11, 11.5, 12, 12.5, 13, 13.5, 14, 14.5, 15, 18, 19, 22, 28, 32, 72]
  roles:
    h1_nombre:      {family: display, size: 72, weight: 800, line_height: 1.0}
    subtitulo:      {family: script,  size: 28, weight: 600}
    caveat_pie:     {family: script,  size: 22, weight: 600}
    rating_num:     {family: display, size: 32, weight: 800}
    inspiracion:    {family: display, size: 18, weight: 500, style: italic, line_height: 1.30}
    cita:           {family: display, size: 19, weight: 500, style: italic, line_height: 1.30}
    casa:           {family: sans, size: 14.5, weight: 800, letter_spacing: 4.5, transform: uppercase}
    datos_hero:     {family: sans, size: 14.5, weight: 600}
    sec_title:      {family: sans, size: 13.5, weight: 800, letter_spacing: 2.5, transform: uppercase}
    pie:            {family: sans, size: 13, weight: 700, line_height: 1.30}
    fecha_sep:      {family: sans, size: 12.5, weight: 600, letter_spacing: 1.5}
    sello:          {family: sans, size: 10, weight: 800, letter_spacing: 1.0, transform: uppercase}
    fuente_line:    {family: sans, size: 10, weight: 600}
    nota_fondo:     {family: sans, size: 9, style: italic}

