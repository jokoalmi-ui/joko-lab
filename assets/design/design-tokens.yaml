# design-tokens.yaml - FUENTE UNICA de diseno de Joko Lab
#
# Fase 0 del plan de design system (2026-10-19).
# Todos los valores estan MEDIDOS: extraidos literalmente del bloque <style>
# de fichas v5 que pasaron la puerta preenvio (17/17). Ningun valor inferido
# ni copiado de una libreria externa.
#
# Consumidores previstos: infografia-html, render-html-a-imagen, sketch,
# baoyu-infographic, linkedin-carrusel-lab, archify, perfume-del-dia.
# Estado: draft. No se migra ninguna skill hasta validar este fichero.

