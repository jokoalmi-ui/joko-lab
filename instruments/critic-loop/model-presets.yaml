# ─── Estrategia de uso recomendada ─────────────────────────────
#
# Primera evaluación (rápida):   [RETIRADO 02-oct-2026 — qwen3.5-9b no está en
#                                 disco; elegir sustituto, ver nota arriba]
# Evaluación profunda:           glm-4.6v-flash → evidencias detalladas
# Evaluación multi-pantalla:     gemma-4-12b-qat → 3-4 capturas en un prompt
# Acuerdo entre modelos:         ejecutar los 3 y comparar scores → Agreement
#
# Si Agreement < 70% en un principio, ese principio necesita refinamiento.
