<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<title>Zorionak, Maite!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; }
  body { font-family:'DejaVu Sans', sans-serif; }
  .card {
    width:1080px; height:1920px;
    padding:64px 70px 56px;
    background:linear-gradient(180deg, #fdf5ea 0%, #f9e8d6 55%, #f2d7bf 100%);
    display:flex; flex-direction:column; align-items:center;
    position:relative; overflow:hidden;
  }
  .deco { position:absolute; border-radius:50%; pointer-events:none; }
  .deco1 { width:430px; height:430px; background:#701f31; opacity:.055; top:-170px; right:-150px; }
  .deco2 { width:340px; height:340px; background:#d89a5b; opacity:.10; bottom:-130px; left:-120px; }
  .deco3 { width:14px; height:14px; background:#701f31; opacity:.18; border-radius:50%; top:330px; left:80px; }
  .deco4 { width:10px; height:10px; background:#701f31; opacity:.14; border-radius:50%; top:368px; left:112px; }

  .kicker {
    font-size:29px; letter-spacing:9px; text-transform:uppercase;
    color:#a56a52; text-align:center;
  }
  h1 {
    font-family:'DejaVu Serif', serif; color:#701f31;
    text-align:center; line-height:1.04; margin-top:16px;
  }
  h1 .l1 { display:block; font-size:82px; font-weight:bold; }
  h1 .l2 { display:block; font-size:128px; font-weight:bold; font-style:italic; }

  .foto { margin-top:36px; width:498px; }
  .foto img {
    width:100%; display:block; border-radius:26px;
    border:10px solid #ffffff;
    box-shadow:0 18px 46px rgba(112,31,49,.20);
  }

  .msg { margin-top:36px; text-align:center; max-width:930px; }
  .msg p { font-size:38px; line-height:1.52; color:#4b2a22; }
  .msg p + p { margin-top:16px; }
  .amor {
    margin-top:28px;
    font-family:'DejaVu Serif', serif; font-style:italic; font-size:56px;
    color:#8c2f3e; text-align:center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="deco deco1"></div>
    <div class="deco deco2"></div>
    <div class="deco deco3"></div>
    <div class="deco deco4"></div>

    <div class="kicker">Urtebetetze zoriontsua</div>
    <h1>
      <span class="l1">Zorionak,</span>
      <span class="l2">Maite!</span>
    </h1>

    <div class="foto">
      <img src="file:///home/jokoalmi/joko-lab/research/infografias/tarjeta-cumpleanos-maite-20260908/maite.jpg" alt="Maite">
    </div>

    <div class="msg">
      <p>Zurekin nagoela denak du zentzua, eta ez dut egun bat ere galdu nahi zure ondoan.</p>
      <p>Gaur zure eguna da: ospa dezagun!</p>
    </div>

    <div class="amor">Maite zaitut. Musu handi bat! &#9829;</div>
  </div>
</body>
</html>
