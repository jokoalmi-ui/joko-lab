# Banco de verificación de Joko Lab
#
# REGLAS PARA AÑADIR PREGUNTAS:
#   1. `fuente` es obligatoria: debe apuntar a un documento concreto del lab
#      (ficha de modelo, decision memory, patrón). Si no podéis señalar el
#      documento que contiene la respuesta, la pregunta no vale.
#   2. Solo entran preguntas con respuesta objetivamente comprobable:
#      un número, un nombre exacto, o la presencia de keywords concretas.
#      Nada de "¿fue una buena respuesta?".
#   3. Este archivo lo mantenéis vosotros a mano, nunca Hermes.
#   4. Rotad/añadid preguntas cada vez que cerréis una ficha o decisión nueva,
#      y guardad alguna antigua en reserva para auditorías ciegas puntuales
#      (ver README, sección "Rotación del banco").

