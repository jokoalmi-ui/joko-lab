body: "Escritura mínima de memoria episódica (integrada con RULE-009, sin duplicar): al cerrar una tarea/incidente/cambio relevante, si el evento encaja en un ledger especializado (LEC-* a lecciones_ledger, MEL-* a mel_ledger, OP-* a operations_ledger) escribir ALLÁ como hasta ahora; si NO encaja (cotidiano: cambios de config, tareas cerradas, eventos de sesión, decisiones menores), añadir UNA línea a episodic_ledger.jsonl con esquema ep_id/ts/dominio/tipo/evento/causa/accion/ref/estado. El shared-events se mantiene como aviso en vivo EFÍMERO (se poda a 14 días) — no es la memoria; el ledger es la memoria. Los crons/watchdogs NO escriben en episodic_ledger (solo sesiones). Consulta unificada: memoria-episodica.sh {hoy|dominio X|abiertos|buscar texto|ultimo N}."
