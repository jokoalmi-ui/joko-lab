evidence:
- 'Directriz explicita del usuario (12-oct-2026, sesion de la noche; hora del sistema medida con `date` por el usuario por RULE-012): «anota como rule», tras proponerle la regla «estado ok + error silenciado = fallo invisible durante dias» a partir del caso de esa sesion'
- 'Causa del motivo falso, localizada en codigo: tools/llm-router.sh:72 `if timeout 180 lms load "$model" >/dev/null 2>&1; then` descarta stdout y stderr; :80 imprime `Carga directa fallo (VRAM ocupada?) — intentando swap...` (suposicion, no error) y :107 `ERROR: no se pudo cargar $model (comprobar VRAM/libre)`'
- 'La suposicion impresa queda falsada por la medida: GPU a las 23:21:06 = `1836 MiB, 12282 MiB, 1 %, 43` con cero modelos cargados y `ollama` arriba sin modelo residente -> la VRAM no estaba ocupada; el motivo del artefacto no describe lo que paso'
- 'Producto degradado con el job padre en ok (informe del 2026-10-12): `# Gate de veracidad: [SIN RESUMEN — GATE OMITIDO] (GATE_OMITIDO)`, `# Juez de calidad: CALIDAD: omitido`, resumen no disponible por «motor ocupado», `FAILED (errors=9, skipped=56)`'
- 'Frontera de entorno: ~/.bashrc:120 `export PATH="$PATH:/home/jokoalmi/.lmstudio/bin"` frente a ~/.config/systemd/user/hermes-gateway.service:11, que fija un PATH explicito (node/bin, .local/bin, .cargo/bin, /usr/*) SIN ~/.lmstudio/bin -> todo job del planificador nace sin `lms`. El binario existe en /home/jokoalmi/.lmstudio/bin/lms. REPRODUCCION EN VIVO PENDIENTE (comando propuesto en la sesion, no ejecutado): pendiente declarado en history'
- 'Segundo silencio, en el sentido contrario: consolidador-sesiones (job 9474f6f3d224) con artefacto mas reciente 2026-09-30_22-31-54.md; 12 dias sin producto y sin informe nuevo, muere a los 26,7 s antes de que el wrapper escriba nada (CP-012: estado unknown resuelto en el artefacto = no existe)'
- 'CP-012 declara el borde contrario y esta RULE lo cubre sin contradecirla: el motor no se declara ok cuando no lo sabe, y su literal de honestidad es «Scheduler restarted...whether side effects ran is unknown»; el caso de esta RULE es el ejecutor que se declara ok porque el error se perdio dentro del propio script, no en el motor'
