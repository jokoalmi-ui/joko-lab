title: "El estado ok con el error descartado es un falso ok: quien invoca un binario o un motor no silencia su error, y el ok se acredita en el artefacto"
desc: >-
  Norma de proceso en dos clausulas. (1) Ningun script del lab que invoque un
  binario, un motor de inferencia o una herramienta externa descarta su salida
  de error (patron `>/dev/null 2>&1` sin captura): el error real se captura y se
  escribe en el motivo del artefacto, aunque el resultado final del paso sea
  correcto. Un motivo que es una SUPOSICION (p. ej. «VRAM ocupada?») en lugar del
  error literal produce un diagnostico falso y encadena la decision equivocada
  (aqui: escalar a cloud creyendo que la GPU estaba llena, cuando estaba vacia).
  (2) El estado ok del motor NO acredita el producto: el `ok` solo dice que el
  wrapper termino, no que su salida sea buena; el producto se comprueba en el
  artefacto (patron CP-012, ampliado aqui al caso que CP-012 declara fuera de su
  alcance: el ejecutor que SI se declara ok porque el error se perdio una capa
  mas abajo, dentro del script). Clausula de entorno, misma familia y mismo
  incidente: un proceso lanzado por el planificador (cron de Hermes, servicio
  systemd) NO hereda el entorno del shell interactivo — `~/.bashrc` no se lee —,
  asi que un binario que solo entra en el PATH desde `~/.bashrc` simplemente NO
  EXISTE para ese job; su fallo (command not found) es indistinguible, para quien
  no mira la salida, de la causa que el script supone. El script que depende de
  un binario se asegura el PATH o declara la dependencia. Caso medido
  2026-10-12 (dos sintomas, una clase): el orquestador batch escalo a cloud con
  motivo «no se pudo cargar openai/gpt-oss-20b (comprobar VRAM/libre)» mientras
  `nvidia-smi` daba 1836 MiB usados de 12282 y ningun modelo cargado; y el
  informe diario local lleva degradado en silencio con el job en ok (gate de
  veracidad OMITIDO, juez de calidad omitido, resumen no disponible «motor
  ocupado»). Alcance: todo_joko_lab (cualquier script, job, tool o pipeline del
  lab); no sustituye a RULE-014 (cada tarea se ejecuta desde su skill) ni a
  CP-012 (que sigue gobernando el `unknown` del motor).
