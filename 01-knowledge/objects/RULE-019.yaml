title: "MoE que no cabe en VRAM: se lanza con la cache de expertos (--moe-cache-mib 512), nunca con 0"
desc: >-
  Cuando un modelo MoE no cabe en la GPU y hay que repartir expertos a CPU
  (-ncmoe), el lanzamiento lleva la cache de expertos de llama.cpp con
  --moe-cache-mib 512, NO el default 0. La cache guarda en VRAM los expertos que
  el reparto deja en CPU: si el routing vuelve a pedir el mismo, no se re-copia
  por PCIe. Medido en el lab (EXP-20261009-008, 09-oct-2026, temp=0, reparto
  fijo -ngl 99 -ncmoe 28 -c 2048 -ub 128, Qwen3.6-35B-A3B MXFP4 18,9 GiB en RTX
  A2000 12 GB): entrada estructurada 5,55 -> 8,54 tok/s y prosa 7,54 -> 11,88
  tok/s, con 3 replicas de C=0 y 3 de C=1024 sin solape y ruido medido 9-11 %.
  Valor recomendado 512: 256 da 7,47 y 512 da 8,95 en la misma entrada, asi que
  la saturacion llega ya a 512; 1024 aporta +0-0,5 tok/s a cambio de ~1 GiB de
  VRAM. -moe-cache-mib 2048 NO arranca (fallo de reserva de los buffers de la
  cache). Alcance: SOLO para el patron "MoE que no cabe"; con un modelo denso o
  que cabe entero, la cache sobra y el reparto a CPU no se usa. Limites de la
  medida (declarados en la DEC-006 y en f1-resultados): se midio con swap al
  100 % y ComfyUI de fondo, n=3 en 0/1024 y n=1 en 256/512, una sola maquina ->
  el contraste relativo es valido, la cifra absoluta NO se extrapola. La salida
  a temp=0 NO es identica entre C=0 y C>0 en prosa (595 vs 597 chars) -> no
  comparar la calidad del texto entre configuraciones como si fuera la misma
  corrida. Bloqueo operativo del lanzador: lms load NO expone flags de llama.cpp
  -> esta ruta exige lanzar llama-server 2.55.0 a mano (LD_LIBRARY_PATH al
  vendor CUDA) en un puerto propio; el flag solo existe en el runtime
  llama.cpp 2.55.0 (libllama-common.so.0.6.0) y no toca :1234, Ollama, n8n ni
  ComfyUI. Si mas adelante un runtime de LM Studio lo expone en lms load, esta
  regla se simplifica (entonces la DEC-006 se revisa). No sustituye al modelo de
  trabajo del lab: deja el MoE en el orden de los ~8-12 tok/s, no en los ~40
  de un modelo que cabe entero.
