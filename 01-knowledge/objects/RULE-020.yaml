title: "CV para ofertas: prototipo de 2 columnas en 1 hoja A4 (Courier 7,6 pt) y el entregable de «1 hoja» es el PDF de Chrome, nunca el DOCX"
desc: >-
  Cuando el usuario pida un CV para una oferta, se parte del prototipo de 2
  columnas (izquierda 34 % / derecha 66 %) que cabe en 1 hoja A4, tipografia
  Courier New, con telefono y email en negrita, y se ajusta a la oferta
  concreta si hace falta. Formato por defecto confirmado por el usuario el
  10-oct-2026. Cifras medidas (pdfinfo / pdftotext -bbox / pdffonts, no
  supuestas): con Calibri 8 pt ya cabia (A4 594,96 x 841,92 pts, yMax 763,80),
  pero con Courier 8 pt se iba a 2 paginas, y apretando a 7,6 pt / interlineado
  1,15 / margenes 8 9 7 9 mm vuelve a Pages: 1 con yMax 764,28 (limite util
  799) = ~35 pt libres. Dos limites declarados, no ocultados: (1) Courier New
  NO esta instalado en el PC y el sistema resuelve a Liberation Mono,
  metricamente compatible (el PDF embebe LiberationMono y LiberationMono-Bold);
  (2) el DOCX NO cabe en 1 hoja: LibreOffice no respeta ni el @page ni el
  reparto de columnas y da 3 paginas -> la verificacion de «1 hoja» se hace
  SIEMPRE sobre el PDF generado por Chrome headless con --no-pdf-header-footer,
  y el DOCX es solo un borrador editable. Alcance: formatos de CV para ofertas
  en ~/empleo-seguimiento; el CV maestro cv-maestro-2026.* es la fuente de datos
  y se alinea a las mismas decisiones de contenido (Master sin «Online» y con
  105 h) pero NO hereda el formato de 2 columnas. Ajuste permitido por oferta
  (vocabulario literal de la oferta, recortes), siempre verificando despues con
  pdfinfo que sigue en 1 pagina. No sustituye a RULE-014: antes de maquetar hay
  que ejecutar la skill cv-adaptado-ats, que ya contiene el procedimiento.
