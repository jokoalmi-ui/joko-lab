title: "Canales de contenido NO confiables: 2 datos falsos burdos verificados -> excluir del monitor"
desc: >-
  Un canal de contenido vigilado por el lab (YouTube, Instagram, Telegram u
  otra fuente usada para técnicas del lab o para documentar contenido) pasa a
  NO CONFiable y se ELIMINA del monitor cuando se verifican 2 publicaciones
  con datos falsos BURDOS. Se entiende por burdo: una afirmación factual
  GRANDE y contrastable que resulta falsa al verificarla contra fuente real
  (no un error menor, no una opinión, no hipérbole de titular, no un matiz).
  El dato falso solo cuenta cuando queda VERIFICADO contra fuente real
  (gate de veracidad habitual, RULE-013/015), nunca por sospecha. Al expulsar
  un canal: (1) anotarlo en CANALES-NO-CONFIABLES.md con fecha, motivo y las
  2 publicaciones que lo causaron; (2) quitarlo del monitor activo y de la
  lista de canales de referencia de la skill correspondiente; (3) no usarlo
  como fuente para técnicas, documentación ni contenido del lab.
