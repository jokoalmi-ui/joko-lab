title: "Un hecho caducado se marca, no se borra: vigencia declarada en el frontmatter y lector que la mide"
desc: >-
  Norma de vigencia del conocimiento del lab. (1) TODO analisis nuevo de
  research/ nace con tres campos en el frontmatter: data_as_of (fecha en que se
  midio el dato), last_validated (ultima comprobacion contra el mundo) y
  next_review (fecha en que caduca y hay que re-medirlo; por defecto a 90 dias).
  (2) Un fichero vivo cuyos datos se han quedado viejos NO se reescribe ni se
  poda: se le anade invalidated con la lista de afirmaciones caducadas, cada una
  con claim, since y evidence (ruta o fichero que lo desmiente). Igual que
  superseded_by cuando lo que caduca es el fichero entero. (3) El lector
  tools/revisar_vigencia.py es de solo lectura y exit 0 siempre: informa de
  CADUCADOS, INVALIDADOS y SIN FECHAR. Un fichero sin campos no es un error, es
  deuda contable. (4) Un dato con next_review vencido no puede citarse como
  vigente sin volver a medirlo; citarlo es el fallo, no que el fichero este
  viejo. Los campos replican el esquema que ya usan las RULE (last_validated,
  next_review, superseded_by) para no inventar un vocabulario paralelo.
  Alcance: research/ y 01-knowledge/objects/. No-retrofit: los 404 analisis sin
  fechar NO se rellenan a posteriori con el mtime, porque el mtime es la fecha de
  la ultima edicion, no la del dato, y produciria fechas falsas con apariencia de
  verificadas.
