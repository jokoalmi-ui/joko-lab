body: >-
  Los backups ".bak-YYYYMMDD" de ficheros del laboratorio se crean SIEMPRE en la
  MISMA carpeta del fichero original (dentro del arbol que respaldan, p.ej.
  joko-lab/ o hermes-lab/), NUNCA en ~/ ni en ninguna ruta fuera del arbol
  respaldado. Un backup que vive fuera del arbol no lo cubre backup-joko-lab.sh
  (rsync de joko-lab/), ni el tar de cierre, ni la rotacion diaria: es un backup
  de riesgo (se pierde si se limpia home) y ademas es invisible para search_files
  (dotfiles) -> falso negativo de diagnostico. Si por la razon que sea un backup
  puntual debe vivir fuera del arbol, registrarlo en shared-events y verificarlo
  con find/ls -la, nunca con search_files. Verificacion:
  tools/check-backup-huerfanos.sh (avisa si hay .bak-* en home).
