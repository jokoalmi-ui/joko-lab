title: "Un fallo detectado no se cierra corrigiendo el artefacto: se cierra corrigiendo el instrumento que lo dejo pasar, y se escribe la norma"
desc: >-
  Norma de proceso en tres clausulas y un control. (1) CORREGIR EL ARTEFACTO:
  el dato o el fichero que salio mal se arregla con la fuente real delante (BD,
  etiqueta del producto, web oficial), nunca de memoria. (2) CORREGIR EL
  INSTRUMENTO: lo que produjo el fallo (puerta de validacion, docstring, prompt
  de un cron, esquema de la BD, umbral heredado) se toca en el mismo trabajo;
  arreglar solo la salida deja el mismo agujero abierto para el dia siguiente.
  (3) ESCRIBIR LA NORMA: la leccion queda en la skill del flujo o en una RULE con
  las cifras medidas, y se anota como se evito el fallo, no solo que se evito.
  (4) CONTROL NEGATIVO OBLIGATORIO: toda correccion de una puerta o de un
  instrumento se verifica ademas con un caso que DEBE fallar (una copia del
  artefacto con el defecto reintroducido). Que el caso bueno siga pasando no
  demuestra nada: la puerta ya lo dejaba pasar antes de tocarla.
  Alcance: todo_joko_lab. Se aplica hacia delante: no autoriza rehacer fichas,
  informes ni artefactos ya publicados (regla de no-retrofit), que se corrigen
  solo si el usuario lo pide y como fichero nuevo.
