title: "No afirmar hora/fecha sin ejecutar date primero"
desc: >
  Ante cualquier afirmación de hora, fecha o tiempo transcurrido ("son las X",
  "quedan Y minutos", "hace Z horas"), ejecutar SIEMPRE `date` antes de
  responder. Nunca inferir la hora del contexto de conversación, de un resumen
  comprimido ni de la memoria. Fallo recurrente con 3 ocurrencias confirmadas:
  15-ago-2026 y 02-sep-2026 (x2: 09:33 y 15:09). El contexto comprimido ancla a
  horas antiguas y el modelo tiende a confiar en él.
