body: |
  # MoE que no cabe en VRAM: lanzar con la cache de expertos (`--moe-cache-mib 512`)

  ## Decision

  Para el patron "MoE que no cabe en la GPU y hay que repartir expertos a CPU",
  lanzar `llama-server` con reparto fijo MAS la cache de expertos:

  ```
  --ncmoe 28 --moe-cache-mib 512
  ```

  y NO con `--moe-cache-mib 0` (el default). El valor recomendado es **512 MiB**;
  256 MiB si la VRAM escasea; 1024 solo si sobran ~1 GiB (compra +0-0,5 tok/s).

  ## Por que (medido, no estimado)

  | `--moe-cache-mib` | E1 estructurada | E2 prosa |
  |---|---|---|
  | 0 | 5,55 tok/s | 7,54 tok/s |
  | 256 | 7,47 (+35 %) | — |
  | 512 | 8,95 (+61 %) | — |
  | 1024 | 8,54 / 9,01 | 11,88 (+58 %) |
  | 2048 | NO ARRANCA (reserva de los buffers de cache) | — |

  La cache guarda en VRAM los expertos que el reparto deja en CPU: si el routing
  vuelve a pedir el mismo experto, no se re-copia por PCIe. Sube el pico de VRAM
  ~1 MiB por MiB pedido -> el C maximo es "VRAM libre menos margen".

  Efecto operativo: el MoE de 35B-A3B pasa de **1,44-5,55 tok/s** a **8,5-11,9 tok/s**,
  es decir del orden de la referencia de trabajo del lab (~11 tok/s). Sigue lejos de
  un modelo que cabe entero (~40 tok/s): **no sustituye al modelo de trabajo**, es la
  opcion para cuando ese MoE concreto hace falta.

  ## Alcance y limites

  - Medido con Qwen3.6-35B-A3B MXFP4 (18,9 GiB) en RTX A2000 12 GB, LM Studio en `:1234`
    (esta DEC no toca `:1234`, Ollama, n8n ni ComfyUI: el `llama-server` va en puerto propio).
  - **No aplica a modelos densos** ni a modelos que caben enteros: ahi la cache sobra.
  - Cifras absolutas NO extrapolables: se midio con **swap al 100 %** y ComfyUI de fondo
    (~190 MiB); n=3 replicas en C=0/1024 y n=1 en 256/512; una sola maquina. El contraste
    relativo (intercalado) si es valido.
  - La salida de texto NO es identica entre configuraciones a temp 0 (E2 cambio 1 token):
    no comparar calidad de texto entre C=0 y C>0 como si fuera la misma corrida.

  ## Como se lanza (bloqueo del lanzador)

  `lms load` no expone flags de llama.cpp, asi que LM Studio no puede pedir la cache.
  Comando verificado (runtime 2.55.0 + libs del vendor CUDA):

  ```
  LD_LIBRARY_PATH=/home/jokoalmi/.lmstudio/extensions/backends/vendor/linux-llama-cuda12-vendor-v1 \
  /home/jokoalmi/.lmstudio/extensions/backends/llama.cpp-linux-x86_64-nvidia-cuda12-avx2-2.55.0/llama-server \
    -m "/mnt/ssd_ia_datos/LM STUDIO/noctrex/Qwen3.6-35B-A3B-MXFP4_MOE-GGUF/Qwen3.6-35B-A3B-MXFP4_MOE.gguf" \
    --host 127.0.0.1 --port 8099 -c 2048 -ngl 99 -ncmoe 28 --moe-cache-mib 512 -t 6
  ```

  ## Cuando se revisa

  - Si un runtime de LM Studio expone el flag en `lms load` (entonces esta DEC se simplifica).
  - Si cambia el modelo MoE objetivo (otro quant, otro reparto `-ncmoe` o contexto grande).
  - Si `tok/s` con cache baja de 8 en el reparto de referencia.
  - `next_review` 2026-11-09; `expires` 2027-01-09 (la cifra caduca: otro runtime/motor la invalida).
