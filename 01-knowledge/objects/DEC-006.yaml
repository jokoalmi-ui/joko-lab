title: "MoE que no cabe en VRAM: lanzar con --moe-cache-mib 512 (caché de expertos en GPU)"
desc: >-
  Cuando un MoE no cabe en la GPU y hay que repartir expertos a CPU, añadir la caché de
  expertos de llama.cpp (--moe-cache-mib) sube el rendimiento un ~55 % con la misma máquina,
  el mismo fichero y el mismo reparto. Medido en el lab: 5,55 -> 8,54 tok/s (entrada
  estructurada) y 7,54 -> 11,88 tok/s (prosa). El techo práctico se alcanza con 512 MiB;
  con 2048 el arranque muere. El flag NO lo expone el lanzador de LM Studio: hay que lanzar
  llama-server 2.55.0 a mano en un puerto propio.
