title: "Nueva versión de Hermes Agent: investigar incidencias 5 días ANTES de actualizar en el lab"
desc: >-
  Cuando el watchdog detecte una NUEVA versión de Hermes Agent (release en
  GitHub), el lab NO actualiza de inmediato. Durante los 5 días posteriores a
  la publicación se investigan posibles incidencias derivadas de esa versión
  (issues/PRs del repo oficial NousResearch/hermes-agent con la etiqueta de
  riesgo de sesión/estado, foros expertos, patrones de error conocidos) antes
  de decidir actualizar. La actualización solo procede si el análisis no
  encuentra bugs conocidos que afecten al lab, o si el fix buscado ya está en
  la release. Origen: incidente state.db 02-03 sep 2026 — corrupción por bug
  upstream introducido en la ventana 0.21 (probe _read_sqlite_application_id
  que cancelaba locks POSIX, issue #100313, fix PR #100519 mergeado DESPUÉS de
  la release v0.21.0 publicada). Lección: una release .0 puede publicarse sin
  fixes de corrupción de state.db que se mergean días después; esperar 5 días
  con investigación activa evita actualizar a una versión con bugs conocidos
  de persistencia. Excepción: urgencia justificada con análisis previo y
  aprobación explícita del usuario.
