body: >-
  El 02-03 sep 2026 el gateway de Hermes falló con "database disk image is malformed"
  (error pegado en sesión CLI el 02-sep ~23:03; persistente desde 07:05 del 03-sep).
  El diagnóstico por terminal identificó corrupción en ~/.hermes/state.db, localizada
  en las tablas FTS messages_fts y messages_fts_trigram, que reportaban "vtable
  constructor failed". Causa raíz probable: escritura concurrente sobre state.db sin
  checkpoint limpio en modo WAL, que dejó las tablas FTS inconsistentes. La solución
  aplicada fue recuperar la base con sqlite3 .recover y reconstruir manualmente las
  dos tablas FTS (messages_fts y messages_fts_trigram); verificado: session_search
  vuelve a devolver resultados. Este incidente es de infraestructura del gateway y
  NO está relacionado con el chunking del RAG (RecursiveCharacterTextSplitter del
  indexer, verificado en indexer.py:142): no hubo reindexación ni cambio de chunking
  involucrados. Acción preventiva a valorar: garantizar checkpoint limpio / acceso
  secuencial a state.db en modo WAL para evitar recurrencia.
