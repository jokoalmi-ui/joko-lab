title: "Un proceso de fondo (curador de Hermes) NO escribe skills del lab sin OK: si una skill cambia bajo tus pies, parar y reportar"
desc: >-
  Ningun proceso de fondo del lab (el curador de Hermes u otro pase
  automatico del gateway) escribe el CONTENIDO de una skill sin OK explicito
  del usuario: tocar una skill es una ESCRITURA y requiere OK, igual que
  escribir en el backlog o en la BD. El curador SI lo hace por su cuenta y sin
  que el agente lo pida (medido 20-sep-2026: 16 mutaciones con actor `curator`
  en 4 h sobre 4 skills del lab, con el pase informando `llm: skipped
  (consolidation off)` — la escritura no viene del pase de consolidacion).
  Re-medido 30-sep-2026 (recuento directo de `.curator_ledger.jsonl`: 1754
  filas desde el 01-sep (foto de las 16:41 CEST; 1757 filas y curator=1341
  a las 17:04:04), actores agent=416 / curator=1338; y `hermes curator
  ledger`): 55 operaciones con actor `curator` en un dia sobre 7-8 nombres de
  skill (7 en la ventana de las 16:41 y 8 a las 17:03 CEST) y
  subiendo mientras el agente trabajaba (51 a las 16:22 CEST, 55 a las 16:41);
  el pase corre POR TURNO dentro de la sesion del propio agente
  (`evidence.session_id` = sesion del gateway).
  Procedimiento obligatorio ANTES de escribir en una skill: medir
  `stat -c '%s %y'` + `md5sum` y comparar con lo medido previamente; si no
  cuadra, PARAR, leer el fichero ENTERO (puede haber consolidado ya la leccion
  que ibas a escribir: dos versiones de la misma regla se contradicen al
  revisarlas) y auditar la autoria con `hermes curator ledger [--skill
  <nombre>]`, que distingue los actores `curator` / `agent` / `user`. El
  cambio es reversible por mutacion (`hermes curator rollback <id>`, con el
  estado previo guardado como blob en `~/.hermes/.curator_backups/blobs/
  <sha256>`). Si el diff es consolidacion en sitio y la leccion ya esta
  escrita, NO se escribe nada: se reporta. Nada escrito por un proceso de
  fondo se atribuye al agente ni al usuario: la autoria se declara por actor.
  Cortafuegos: `hermes curator pin <skill>` (por skill, deja el curador vivo
  para el resto — opcion preferida por decision del usuario; la ayuda de
  la CLI lo describe como "Pin a skill so the curator never auto-transitions
  it", asi que cubre stale/archive, y NO esta medido que bloquee los parches
  de contenido) o `hermes curator pause` (global, reversible con `resume`),
  que MEDIDO 30-sep-2026 NO detiene el pase por turno: `hermes curator
  status` responde "curator: PAUSED" (13 corridas, la ultima hace 6d,
  intervalo 7d) y las escrituras con actor `curator` siguieron (25-sep y
  30-sep: 55 ops en un dia sobre 7-8 nombres de skill: 7 en la ventana de las
  16:41 y 8 a las 17:03 CEST). El criterio efectivo de que el
  curador escriba es la PROPIEDAD de la skill (`created_by`): las
  curator-managed (96: 71 agent-created + 25 bundled) SI se editan, y las 68
  sin marca (`created_by:null`) se RECHAZAN con el literal "Refusing
  background curator patch for skill '<X>': the skill is not curator-managed
  (created_by=None). User-owned skills are off-limits to autonomous
  curation." (30-sep-2026: `diagnostico-stack-local` 07:59 y 08:16,
  `perfume-del-dia` 08:32 y 09:05, `perfume-ia` 08:33, `instagram-monitor`
  15:15). Lo escrito por el
  curador NO se borra ni se revierte si es correcto: se conserva y se declara.
