body: "Normalizacion de metadatos historicos. Las primeras DECs (DEC-001, DEC-002) carecen de confidence numerica porque se crearon antes de que el esquema KO exigiera confidence obligatoria. Decision: NO rellenar confidence retrospectivamente (un valor inventado contaminaria cualquier modelo que aprenda del historico: 'antes no mediamos esto' es informacion valida; 'la confianza era 0.5' seria falso). En su lugar: confidence_origin: legacy + confidence_status: missing_historical_data + review_required: true, y MEL contabiliza la incompletitud como metrica de integridad epistemica (MEL-Integrity, research/metacognitive-layer-diseno.md). Nota de correccion 06-ago: la referencia previa a 'RULE-CONF-001' era incorrecta — no existe tal KO; la politica de confianza del lab vive en el esquema KO (confidence + confidence_label, ver RULE-007 con confidence 1.0 como referencia de formato) y en MEL-Integrity."
legacy_fields:
  afecta_a:
  - DEC-001
  - DEC-002
  alternativa_rechazada:
    reconstruir_confianza: 'Rechazada: mezclaria "la confianza era 0.5" con "hoy creemos que probablemente era 0.5"'
