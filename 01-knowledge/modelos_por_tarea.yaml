# modelos_por_tarea.yaml — Fuente única de decisión: tipo de tarea → modelo local
# Cargado por tools/pipeline_seleccion_modelo.py y tools/llm-router.sh (NO hardcodear en código).
# version: 3 · last_validated: 2026-10-02
# v3 (01-oct-2026): + campo `alternativas` en todos los buckets (respaldo si el modelo no
#   carga) y + 2 buckets fuera de LM Studio (generacion_imagen, transcripcion). Se quitó la
#   clave suelta `imagen` de `vision` (mandaba tareas de generación al VLM) y se corrigió el
#   comentario que decía que ganaba el "primer bucket en orden" (gana el de más claves).
# v3, rev 02-oct-2026: salen de `modelos_instalados` y de `sin_asignar` los 2 modelos borrados del
#   disco (qwen3.6-35b-a3b-mtp y qwen3.5-9b-the-defiant-...-mtp). Las líneas de `mediciones_bateria_v2`
#   se conservan: son medidas reales de esos modelos (histórico válido).
# Fuentes: batería v2 de 7 dimensiones (01-oct-2026, 7 modelos nuevos) + batería histórica
#          (06-ago-2026, 8 modelos) + ledgers de alucinaciones (24-ago, 06-sep, 14-sep-2026).
#
# HALLAZGO CLAVE (01-oct-2026): la batería NO discrimina capacidad. 13 de los 15 modelos
#   medidos sacan 7/7 (mismos prompts, misma GPU, evaluadores deterministas). Por tanto:
#     - sirve como FILTRO DE DESCARTE (descarta al que falla), no como ranking de calidad;
#     - el rol de cada modelo lo decide (a) segundos en el MISMO test, (b) VRAM que ocupa,
#       (c) tasa de alucinación del ledger cuando la tarea es fáctica.
#
# Campos por entrada:
#   modelo:      id EXACTO de la API de LM Studio (verificar antes de editar)
#   alternativas: ids de respaldo EN ORDEN si `modelo` no llega a cargarse (unload+load falla).
#                Es respaldo de DISPONIBILIDAD, no equivalencia de calidad: garantiza que
#                conteste otro modelo validado (7/7) en vez de dejar la tarea sin motor.
#   cuando:      criterio de activación (palabras clave). OJO: gana el bucket con MAS claves
#                acertadas (pipeline_seleccion_modelo.py: sort por nº de golpes), NO el primero
#                del fichero. En empate gana el orden de aparición aquí.
#   herramienta: el bucket NO se sirve con un LLM de LM Studio (comfyui, whisper...). El
#                pipeline lo marca fuera_de_lmstudio y no carga nada.
#   evidencia:   dato real medido que justifica la asignación (fecha + cifra)
#   prioridad:   "veracidad" | "velocidad" | "balance"  → el pipeline usa esto
#                si la petición pide explícitamente una prioridad distinta.
#   max_tokens:  presupuesto sugerido
#   cloud:       true → NO es local; la tarea no toca LM Studio
#
# ALCANCE REAL (medido 01-oct-2026): este router cubre SOLO texto/chat servido por LM Studio.
#   Fuera de él por diseño: embeddings (RAG usa bge-m3/nomic), transcripción (whisper),
#   generación de imagen (ComfyUI/SDXL), leer/contar ficheros (shell). Los buckets
#   `generacion_imagen` y `transcripcion` declaran los dos casos que antes caían en el bucket
#   equivocado (una tarea de generación llegaba al VLM por la clave suelta `imagen`).

version: 3
last_validated: "2026-10-02"

modelos_por_tarea:

  veracidad_critica:
    descripcion: "Hechos/factuales donde alucinar es caro; sin prisa"
    modelo: qwen3.6-35b-a3b_moe
    cuando: [verdad, hecho, factual, inventado, alucina, "es cierto", "es falso", verificar dato, confirmar dato, "dato exacto", fiable]
    evidencia: "Ledger 06-sep-2026: 0% alucinaciones y 100% honestidad (27 casos x 3 seeds = 81 respuestas; mejor ledger del lab). Bateria v2 01-oct-2026: 7/7 pero 7,0 tok/s — el mas lento de todos los medidos (usar solo sin prisa). VRAM medida: 10.686 MiB."
    prioridad: veracidad
    max_tokens: 2000
    alternativas: [openai/gpt-oss-20b, granite-4.1-8b]

  vision:
    descripcion: "Analizar imágenes, describir visual, OCR de imagen"
    modelo: glm-4.6v-flash
    cuando: [foto, screenshot, captura, "analiza esta imagen", "analiza la imagen", "describe la imagen", "qué hay en", visual, gráfica, mirar la, packshot, "lee el texto de esta imagen", "extrae el texto de la imagen"]
    evidencia: "RULE-014 (vision = GLM local) + bateria de vision lfm-vs-glm 21-ago-2026 + Bateria v2 01-oct-2026: 7/7 en texto y 26,4 tok/s (2o mas rapido de los 7 nuevos). VRAM medida: 9.984 MiB (cabe justo en 12 GB)."
    prioridad: balance
    max_tokens: 800
    alternativas: [google/gemma-4-12b-qat, lfm2.5-vl-3b]

  codigo:
    descripcion: "Generar/revisar código, scripts, funciones, corregir bugs"
    modelo: dolphin3.0-llama3.1-8b-cyber-lora-test-v0.2
    cuando: [codigo, código, script, funcion, función, bug, html, python, javascript, refactoriza, programa que, arregla el error]
    evidencia: "Mismo test B1 (boton contador HTML, max_tokens=1500): 7/7 en 6,3 s frente a 23,6 s de openai/gpt-oss-20b y 31,4 s de granite-4.1-8b — 3,7x mas rapido con el mismo resultado. Coincide con normas-jl.md L361/L363 (codigo → Dolphin) y cierra la contradiccion gpt-oss vs Dolphin. OJO: medicion de 06-ago-2026 (dolphin no se re-midio el 01-oct)."
    prioridad: velocidad
    max_tokens: 1200
    alternativas: [openai/gpt-oss-20b, granite-4.1-8b]

  redaccion_datos:
    descripcion: "Redactar informe/resumen/ficha CON fuente delante (verificador de fidelidad aparte)"
    modelo: google/gemma-4-12b-qat
    cuando: [informe, resumen, ficha, redacta, describe la escena, analisis textual con fuente, basandote en, segun la fuente, traduce, traduccion, "traduce al"]
    evidencia: "25-ago-2026 juicio ciego: gano a gpt-oss y a cloud; fiel con fuente presente (verificador_fidelidad.py). Bateria v2 01-oct-2026: 7/7, 15,4 tok/s; D1 (receta espanola con 5 requisitos) en 50,9 s."
    prioridad: balance
    max_tokens: 1200
    alternativas: [glm-4.6v-flash, granite-4.1-8b]

  grounding:
    descripcion: "Grounding con contexto RAG/documento (citar, responder del contexto)"
    modelo: deepseek/deepseek-r1-distill-qwen-14b
    cuando: [contexto, rag, grounding, citando, "según el documento", "en el texto", con fuente, basate en el contexto]
    evidencia: "RULE-003 + Bateria 06-ago-2026: 7/7 (10,9 tok/s). AVISO del ledger 24-ago-2026: alucinacion muy variable, del 0% al 36,4% segun seed → no usar para hechos, solo para razonar sobre texto presente."
    prioridad: balance
    max_tokens: 1200
    alternativas: [granite-4.1-8b, openai/gpt-oss-20b]

  razonamiento:
    descripcion: "Razonamiento general/lógica/estructurar datos (JSON, extraer, clasificar)"
    modelo: openai/gpt-oss-20b
    cuando: [razon, logica, lógica, "paso a paso", analiza, compara, extrae, clasifica, json, batch, resume esto, resume el, "haz de juez", juez, puntua, evalua esta respuesta]
    evidencia: "19-ago-2026: 96% razonamiento duro, 3-15x mas rapido que R1. Bateria 06-ago-2026: 7/7; en los dos tests de razonamiento (A1+A2) 12,1 s, el mas rapido de los 7/7. Ledger: 0% alucinaciones con T=0,5 (81 respuestas) y 4,5-9,1% con T=0,2 → NO usar para hechos."
    prioridad: velocidad
    max_tokens: 800
    alternativas: [granite-4.1-8b, granite-4.0-h-tiny]

  interactivo:
    descripcion: "Chat con espera humana / razonamiento complejo → NO local"
    modelo: null
    cloud: true
    cuando: [hola, conversacion, chat, "hablame", interactivo]
    evidencia: "Regla del lab: interactivo → cloud DeepSeek (config principal). Si se quiere local rapido: lfm2.5-2.6b (Bateria 06-ago-2026: 7/7, 55,3 tok/s, suma de los 7 tests 75,5 s)."
    prioridad: velocidad
    max_tokens: null
    alternativas: [lfm2.5-2.6b]

  # ── Buckets FUERA de LM Studio (declarados 01-oct-2026) ─────────────────────────
  # Antes: "genera una imagen de un frasco" caía en `vision` (glm) por la clave suelta
  # `imagen` y "transcribe este audio" en el fallback (gpt-oss). Ninguno de los dos es
  # trabajo de un LLM de texto: se declaran aquí para que el pipeline NO cargue nada.

  generacion_imagen:
    descripcion: "Generar/crear una imagen con IA → ComfyUI/SDXL, NO LM Studio"
    modelo: null
    cloud: false
    herramienta: comfyui
    cuando: ["genera una imagen", "crea una imagen", "genera una foto", "dibuja", "renderiza una imagen", "hazme una imagen", sdxl, comfyui, img2img, txt2img]
    evidencia: "Skill generacion-imagen-local (ComfyUI fuera de cgroup: 18G vs 8,9G OOM). El VLM solo analiza imágenes; no las crea."
    prioridad: null
    max_tokens: null
    alternativas: []

  transcripcion:
    descripcion: "Transcribir audio/vídeo a texto → whisper, NO LM Studio"
    modelo: null
    cloud: false
    herramienta: whisper
    cuando: [transcribe, transcripcion, transcripción, "pasa a texto el audio", subtitulos, subtítulos, "audio a texto", "del audio a texto"]
    evidencia: "Skill video-transcription: whisper CPU en el lab. Ningún modelo de LM Studio recibe audio."
    prioridad: null
    max_tokens: null
    alternativas: []

# Fallback si no se detecta tipo
fallback:
  modelo: openai/gpt-oss-20b
  motivo: "Tipo no detectado → gpt-oss-20b (rapido y validado); revisar si la tarea es de hechos → qwen3.6-35b-a3b_moe"
  alternativas: [granite-4.1-8b]

# Modelos instalados reales (02-oct-2026, API :1234/api/v0/models) — para validación del YAML.
