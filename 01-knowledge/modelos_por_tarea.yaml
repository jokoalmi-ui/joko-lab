# ── Medidos y SIN bucket asignado (con motivo) ──────────────────────────────────
sin_asignar:
  - modelo: granite-4.0-h-tiny
    motivo: "7/7 y la VRAM mas baja de los que razonan bien (5.383 MiB; A2 en 1,0 s) → candidato a batch/JSON en paralelo con otro modelo dentro de los 12 GB. Sin bucket por falta de evidencia en tareas largas."
  - modelo: lfm2.5-vl-3b
    motivo: "El mas rapido de los 15 medidos (66 tok/s) pero 6/7: falla A2 y contesta '20' en 0,1 s — fallo real de razonamiento, no artefacto. Valido como VLM rapido, NO como razonador."
  - modelo: lfm2.5-2.6b
    motivo: "7/7, 55,3 tok/s, 5,4 GiB (bateria 06-ago-2026). Alternativa local del bucket interactivo."
  - modelo: granite-4.1-8b
    motivo: "7/7, 25,4 tok/s (bateria 06-ago-2026). Reserva de grounding/JSON si r1-14b no convence."
