  - google/gemma-4-12b-qat
  - granite-4.0-h-tiny
  - granite-4.1-8b
  - lfm2.5-2.6b
  - lfm2.5-vl-3b
  - openai/gpt-oss-20b
  - deepseek/deepseek-r1-distill-qwen-14b
  - dolphin3.0-llama3.1-8b-cyber-lora-test-v0.2

# Embeddings (nunca se cargan para chat; los usa el RAG)
embeddings:
